name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"

          echo "🧹 Starting cleanup for $REPO"
          echo "---------------------------------------------------"

          # Helper: fetch ALL runs for a workflow (paginated)
          get_all_runs() {
            local REPO="$1"
            local WORKFLOW_ID="$2"
            local PAGE=1

            while true; do
              RESPONSE=$(gh api \
                "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100&page=$PAGE" \
                --jq '.workflow_runs[] | select(.status != "in_progress" and .status != "queued" and .status != "waiting") | .id'
              )

              # Stop if empty
              if [ -z "$RESPONSE" ]; then
                break
              fi

              echo "$RESPONSE"
              PAGE=$((PAGE + 1))
            done
          }

          # Fetch all workflows
          WORKFLOWS=$(gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id')

          for WORKFLOW_ID in $WORKFLOWS; do
            WORKFLOW_NAME=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID" --jq '.name')

            echo ""
            echo "📋 Processing workflow: $WORKFLOW_NAME (ID: $WORKFLOW_ID)"

            # Fetch all completed runs (paginated)
            RUNS=$(get_all_runs "$REPO" "$WORKFLOW_ID")

            if [ -z "$RUNS" ]; then
              echo "  ℹ️  No completed runs found"
              continue
            fi

            TOTAL_RUNS=$(echo "$RUNS" | grep -c .)
            echo "  📊 Found $TOTAL_RUNS completed runs"

            # Keep the 10 most recent runs
            RUNS_TO_DELETE=$(echo "$RUNS" | tail -n +11)

            if [ -z "$RUNS_TO_DELETE" ]; then
              echo "  ✅ No runs to delete (keeping last 10)"
              continue
            fi

            DELETE_COUNT=$(echo "$RUNS_TO_DELETE" | grep -c .)
            echo "  🗑️  Deleting $DELETE_COUNT old run(s)..."

            DELETED=0
            FAILED=0

            for RUN_ID in $RUNS_TO_DELETE; do
              if gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID" 2>/dev/null; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
              fi
            done

            echo "  ✅ Deleted: $DELETED"
            if [ "$FAILED" -gt 0 ]; then
              echo "  ⚠️  Failed: $FAILED"
            fi
          done

          echo ""
          echo "---------------------------------------------------"
          echo "✨ Cleanup completed!"
