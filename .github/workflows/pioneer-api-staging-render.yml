name: Trigger auto deployment for pionner-api-staging

on:
    push:
        branches: [develop]
    workflow_dispatch:

jobs:
    # Call the validation workflow first
    code-quality-check:
        uses: ./.github/workflows/validate.yml

    # Run deployment only if validation succeeds
    ci:
        needs: code-quality-check
        runs-on: ubuntu-latest
    steps:
        - name: Deploy
            # Only run this step if the branch is main
            if: github.ref == 'refs/heads/main'
            env:
              deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
            run: |
              curl "$deploy_url"
