name: Publish Types

on:
    workflow_call:
        secrets:
            TOKEN:
                required: true
    workflow_dispatch:

jobs:
    publish-types:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  always-auth: true
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}

            - name: Install dependencies
              run: npm ci

            - name: Get current version from registry
              id: version
              run: |
                  VERSION=$(npm view @arompr/pioneer-api-types version --registry https://npm.pkg.github.com || echo "0.0.0")
                  echo "current=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Prepare generated directory
              run: |
                  mkdir -p ./generated
                  echo '{"name":"@arompr/pioneer-api-types","version":"${{ steps.version.outputs.current }}"}' > ./generated/package.json

            - name: Generate publishable types
              run: npx typeship generate --bump patch

            - name: Publish to GitHub Packages
              working-directory: ./generated
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}
